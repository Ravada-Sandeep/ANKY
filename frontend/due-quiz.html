<!DOCTYPE html>
<html>
<head>
    <title>Due Review Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="quiz-card">

    <h1>Due Review Quiz</h1>

    <h2 id="progress"></h2>

    <h3 id="question"></h3>

    <input
        type="text"
        id="answer"
        placeholder="Enter answer">

    <button id="nextBtn" onclick="nextQuestion()">
        Next
    </button>

    <h3 id="result"></h3>

    <div id="review"></div>

    <script src="due-quiz.js"></script>

</div>

</body>
</html>
